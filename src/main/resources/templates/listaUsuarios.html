<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments :: head(titulo='Usuarios registrados')"></head>

<body>

<div th:replace="fragments :: iconos"></div>
<div th:replace="fragments :: menu"></div>

<div class="container py-4">

    <div class="page-header">
        <h2>Usuarios registrados</h2>
        <p class="page-subtitle mb-0">Revisa los usuarios dados de alta y gestiona su acceso.</p>
    </div>

    <div class="panel table-panel" th:if="${!#lists.isEmpty(usuarios)}">
        <div class="table-responsive">
            <table class="table table-striped table-hover mb-0">
                <thead>
                <tr>
                    <th class="col-id">Identificador</th>
                    <th>Correo electrónico</th>
                    <th class="col-central">Acciones</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="usuario : ${usuarios}">
                    <td class="col-id" th:text="${usuario.id}"></td>
                    <td th:text="${usuario.email}"></td>
                    <td class="col-central">
                        <div class="table-actions">
                            <a class="btn btn-primary btn-xs"
                               th:href="@{/registrados/{id}(id=${usuario.id})}">
                                <svg class="icono" aria-hidden="true" focusable="false">
                                    <use href="#icono-ver"></use>
                                </svg>
                                Ver usuario
                            </a>

                            <form th:action="@{/registrados/{id}/bloqueo(id=${usuario.id})}" method="post">
                                <button type="submit"
                                        class="btn btn-danger btn-xs"
                                        th:if="${!usuario.bloqueado}">
                                    <svg class="icono" aria-hidden="true" focusable="false">
                                        <use href="#icono-bloquear"></use>
                                    </svg>
                                    Bloquear
                                </button>

                                <button type="submit"
                                        class="btn btn-success btn-xs"
                                        th:if="${usuario.bloqueado}">
                                    <svg class="icono" aria-hidden="true" focusable="false">
                                        <use href="#icono-habilitar"></use>
                                    </svg>
                                    Habilitar
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <p th:if="${#lists.isEmpty(usuarios)}" class="empty-state">
        No hay usuarios registrados.
    </p>

</div>

<div th:replace="fragments::javascript"></div>

</body>
</html>
