<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head (titulo)">
    <meta charset="UTF-8"/>
    <title th:text="${titulo}"></title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<nav th:fragment="menuAnonimo" class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">

        <a class="navbar-brand" th:href="@{/about}">
            <svg class="icono icono-marca" aria-hidden="true" focusable="false">
                <use href="#icono-guardar"></use>
            </svg>
            ToDoList
        </a>

        <div class="navbar-nav ml-auto">
            <a class="nav-item nav-link" th:href="@{/login}">
                <svg class="icono" aria-hidden="true" focusable="false">
                    <use href="#icono-login"></use>
                </svg>
                Login
            </a>

            <a class="nav-item nav-link" th:href="@{/registro}">
                <svg class="icono" aria-hidden="true" focusable="false">
                    <use href="#icono-unirse"></use>
                </svg>
                Registro
            </a>
        </div>
    </div>
</nav>

<nav th:fragment="menu" class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">

        <a class="navbar-brand" th:href="@{/about}">
            <svg class="icono icono-marca" aria-hidden="true" focusable="false">
                <use href="#icono-guardar"></use>
            </svg>
            ToDoList
        </a>

        <div class="navbar-nav">
            <a class="nav-item nav-link"
               th:href="@{/usuarios/{id}/tareas(id=${usuarioLogueado.id})}">
                <svg class="icono" aria-hidden="true" focusable="false">
                    <use href="#icono-tareas"></use>
                </svg>
                Tareas
            </a>

            <a class="nav-item nav-link" th:href="@{/equipos}">
                <svg class="icono" aria-hidden="true" focusable="false">
                    <use href="#icono-equipos"></use>
                </svg>
                Equipos
            </a>
        </div>

        <div class="navbar-nav ml-auto">
            <div class="nav-item dropdown">

                <a class="nav-link dropdown-toggle"
                   href="#"
                   id="usuarioDropdown"
                   role="button"
                   data-toggle="dropdown"
                   aria-haspopup="true"
                   aria-expanded="false">
                    <svg class="icono" aria-hidden="true" focusable="false">
                        <use href="#icono-cuenta"></use>
                    </svg>
                    <span th:text="${usuarioLogueado.nombre}">Usuario</span>
                </a>

                <div class="dropdown-menu dropdown-menu-right"
                     aria-labelledby="usuarioDropdown">

                    <a class="dropdown-item" th:href="@{/cuenta}">
                        <svg class="icono" aria-hidden="true" focusable="false">
                            <use href="#icono-cuenta"></use>
                        </svg>
                        Cuenta
                    </a>

                    <a class="dropdown-item"
                       th:href="@{/logout}">
                        <svg class="icono" aria-hidden="true" focusable="false">
                            <use href="#icono-salir"></use>
                        </svg>
                        <span th:text="'Cerrar sesión ' + ${usuarioLogueado.nombre}">Cerrar sesión</span>
                    </a>

                </div>
            </div>
        </div>
    </div>
</nav>

<div th:fragment="javascript">
    <script th:src="@{/js/jquery.min.js}"></script>
    <script th:src="@{/js/popper.min.js}"></script>
    <script th:src="@{/js/bootstrap.min.js}"></script>
</div>
