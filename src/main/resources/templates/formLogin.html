<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments :: head (titulo='Login')"></head>

<body>

<div th:replace="fragments :: iconos"></div>

<div class="auth-wrapper">
    <div class="auth-card">

        <div class="page-header">
            <h2>Login</h2>
            <p class="page-subtitle mb-0">Accede a tu listado de tareas.</p>
        </div>

        <form method="post" th:action="@{/login}" th:object="${loginData}">
            <div class="form-group">
                <label for="eMail">Usuario</label>
                <input id="eMail" class="form-control" name="eMail" placeholder="Correo electrónico"
                       type="text" th:field="*{eMail}" required/>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input id="password" class="form-control" name="password" placeholder="Contraseña"
                       type="password" th:field="*{password}" required/>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <svg class="icono" aria-hidden="true" focusable="false">
                        <use href="#icono-login"></use>
                    </svg>
                    Login
                </button>
            </div>

            <div class="auth-links">
                <a class="btn btn-link" href="/registro">
                    <svg class="icono" aria-hidden="true" focusable="false">
                        <use href="#icono-unirse"></use>
                    </svg>
                    Ir a registro
                </a>
                <a class="btn btn-link" href="/about">
                    <svg class="icono" aria-hidden="true" focusable="false">
                        <use href="#icono-acerca"></use>
                    </svg>
                    Acerca de
                </a>
            </div>
        </form>

        <div class="alert alert-danger mt-3" th:if="${error != null}" th:text="${error}"></div>

    </div>
</div>

<div th:replace="fragments::javascript"/>

</body>
</html>
