<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments :: head (titulo='Registro')"></head>

<body>

<div th:replace="fragments :: iconos"></div>

<div class="auth-wrapper">
    <div class="auth-card">

        <div class="page-header">
            <h2>Registro nuevo usuario</h2>
            <p class="page-subtitle mb-0">Crea una cuenta para empezar a organizar tus tareas.</p>
        </div>

        <form method="post" th:action="@{/registro}" th:object="${registroData}">
            <div class="form-group">
                <label for="eMail">Correo electrónico</label>
                <input id="eMail" class="form-control" name="eMail" placeholder="Correo electrónico"
                       type="text" th:field="*{email}" required/>
            </div>

            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input id="nombre" class="form-control" name="nombre" placeholder="Nombre" type="text"
                       th:field="*{nombre}"/>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input id="password" class="form-control" name="password" placeholder="Contraseña"
                       type="password" th:field="*{password}" required/>
            </div>

            <div class="form-group">
                <label for="fechaNacimiento">Fecha de nacimiento</label>
                <input id="fechaNacimiento" class="form-control" name="fechaNacimiento"
                       placeholder="01-12-2019" th:field="*{fechaNacimiento}"/>
            </div>

            <div class="form-group" th:if="${puedeSerAdministrador}">
                <div class="form-check">
                    <input id="administrador"
                           class="form-check-input"
                           type="checkbox"
                           th:field="*{administrador}"/>

                    <label class="form-check-label" for="administrador">
                        Registrarse como administrador
                    </label>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <svg class="icono" aria-hidden="true" focusable="false">
                        <use href="#icono-guardar"></use>
                    </svg>
                    Registro
                </button>
            </div>

            <div class="auth-links">
                <a class="btn btn-link" href="/login">
                    <svg class="icono" aria-hidden="true" focusable="false">
                        <use href="#icono-login"></use>
                    </svg>
                    Ir a login
                </a>
                <a class="btn btn-link" href="/about">
                    <svg class="icono" aria-hidden="true" focusable="false">
                        <use href="#icono-acerca"></use>
                    </svg>
                    Acerca de
                </a>
            </div>
        </form>

        <div th:object="${registroData}">
            <ul th:if="${#fields.hasErrors('*')}" class="alert alert-danger mt-3 mb-0">
                <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
            </ul>
        </div>

        <ul th:if="${error != null}" class="alert alert-danger mt-3 mb-0">
            <li th:text="${error}"></li>
        </ul>

    </div>
</div>

<div th:replace="fragments::javascript"/>

</body>
</html>
