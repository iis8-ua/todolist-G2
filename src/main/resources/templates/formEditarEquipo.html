<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments :: head (titulo='Editar equipo')"></head>

<body>

<div th:replace="fragments :: iconos"></div>
<div th:replace="fragments :: menu"></div>

<div class="container py-4">

    <div class="page-header">
        <h2 th:text="'Modificación del equipo ' + ${equipoData.nombre}">Modificación del equipo</h2>
        <p class="page-subtitle mb-0">Cambia el nombre con el que se muestra el equipo.</p>
    </div>

    <div class="form-card">
        <form method="post" th:action="@{/equipos/{id}/editar(id=${equipoData.id})}" th:object="${equipoData}">
            <div class="form-group">
                <label for="nombre">Nombre del equipo:</label>
                <input class="form-control" id="nombre" name="nombre" required
                       th:field="*{nombre}" type="text"/>
            </div>

            <div class="form-actions">
                <button class="btn btn-primary" type="submit">
                    <svg class="icono" aria-hidden="true" focusable="false">
                        <use href="#icono-guardar"></use>
                    </svg>
                    Guardar cambios
                </button>
                <a class="btn btn-link" th:href="@{/equipos}">
                    <svg class="icono" aria-hidden="true" focusable="false">
                        <use href="#icono-cancelar"></use>
                    </svg>
                    Cancelar
                </a>
            </div>
        </form>
    </div>

    <div class="flash-messages mt-3">
        <ul th:if="${error != null}" class="alert alert-danger">
            <li th:text="${error}"></li>
        </ul>
    </div>

</div>

<div th:replace="fragments::javascript"/>

</body>
</html>
