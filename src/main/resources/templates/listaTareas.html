<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments :: head(titulo='Tareas')"></head>

<body>

<div th:replace="fragments :: iconos"></div>
<div th:replace="fragments :: menu"></div>

<div class="container py-4">

    <div class="page-header">
        <h2 th:text="'Listado de tareas de ' + ${usuario.nombre}">Listado de tareas</h2>
        <p class="page-subtitle mb-0">Organiza tus tareas y mantén al día tus prioridades.</p>
    </div>

    <div class="flash-messages">
        <div class="alert alert-success alert-dismissible fade show" role="alert"
             th:if="${!#strings.isEmpty(mensaje)}">
            <span th:text="${mensaje}"></span>
            <button type="button" class="close" data-dismiss="alert" aria-label="Cerrar">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>
    </div>

    <div class="panel table-panel" th:if="${!#lists.isEmpty(tareas)}">
        <div class="table-responsive">
            <table class="table table-striped table-hover mb-0">
                <thead>
                <tr>
                    <th class="col-id">Id</th>
                    <th>Tarea</th>
                    <th class="col-central">Prioridad</th>
                    <th class="col-central">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="tarea: ${tareas}">
                    <td class="col-id" th:text="${tarea.id}"></td>
                    <td th:text="${tarea.titulo}"></td>
                    <td class="col-central" th:text="${tarea.prioridad}"></td>
                    <td class="col-central">
                        <div class="table-actions">
                            <a class="btn btn-primary btn-xs"
                               th:href="@{/tareas/{id}/editar(id=${tarea.id})}">
                                <svg class="icono" aria-hidden="true" focusable="false">
                                    <use href="#icono-editar"></use>
                                </svg>
                                Editar
                            </a>
                            <button class="btn btn-danger btn-xs"
                                    th:onclick="'del(\'/tareas/' + ${tarea.id} + '\')'">
                                <svg class="icono" aria-hidden="true" focusable="false">
                                    <use href="#icono-borrar"></use>
                                </svg>
                                Borrar
                            </button>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <p th:if="${#lists.isEmpty(tareas)}" class="empty-state">
        Todavía no tienes tareas. Crea una nueva para empezar.
    </p>

    <div class="page-actions">
        <a class="btn btn-primary" th:href="@{/usuarios/{id}/tareas/nueva(id=${usuario.id})}">
            <svg class="icono" aria-hidden="true" focusable="false">
                <use href="#icono-nuevo"></use>
            </svg>
            Nueva tarea
        </a>
        <a class="btn btn-link" href="/logout">
            <svg class="icono" aria-hidden="true" focusable="false">
                <use href="#icono-salir"></use>
            </svg>
            Salir
        </a>
    </div>

</div>

<div th:replace="fragments::javascript"/>

<!-- Lanzamos una petición DELETE por JavaScript para borrar una tarea -->

<script type="text/javascript">
    function del(urlBorrar) {
        if (confirm('¿Estás seguro/a de que quieres borrar la tarea?')) {
            fetch(urlBorrar, {
                method: 'DELETE'
            }).then((res) => location.reload());
        }
    }
</script>

</body>
</html>
